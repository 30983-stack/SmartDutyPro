<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Duty Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

    <div class="login-card">

        <div class="logo">🏫</div>

        <h1>Smart Duty Pro</h1>

        <p>ระบบจัดการเวรนักเรียนอัจฉริยะ</p>

        <div class="input-group">
            <label>ชื่อผู้ใช้</label>

            <input
                id="username"
                type="text"
                placeholder="กรอกชื่อผู้ใช้"
            >
        </div>

        <div class="input-group">
            <label>รหัสผ่าน</label>

            <input
                id="password"
                type="password"
                placeholder="กรอกรหัสผ่าน"
            >
        </div>

        <button
            class="login-button"
            onclick="login()"
        >
            🔐 เข้าสู่ระบบ
        </button>

        <div id="loginError"></div>

        <div class="demo-box">

            <b>บัญชีทดลอง</b>

            <p>👨‍🏫 ครู : teacher / 1234</p>
            <p>👑 หัวหน้าเวร : leader / 1234</p>
            <p>👨‍🎓 นักเรียน : student / 1234</p>

        </div>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">🏫</div>

            <div>
                <b>Smart Duty</b>
                <small>PRO SYSTEM</small>
            </div>

        </div>


        <div class="profile">

            <div class="avatar">
                👤
            </div>

            <div>
                <b id="profileName">ผู้ใช้</b>
                <small id="profileRole">ผู้ใช้งาน</small>
            </div>

        </div>


        <nav>

            <button onclick="showPage('dashboard')">
                📊
                <span>ภาพรวม</span>
            </button>

            <button onclick="showPage('duties')">
                📅
                <span>ตารางเวร</span>
            </button>

            <button onclick="showPage('check')">
                ✅
                <span>ตรวจเวร</span>
            </button>

            <button onclick="showPage('requests')">
                📝
                <span>คำร้อง</span>
            </button>

            <button onclick="showPage('students')">
                👥
                <span>นักเรียน</span>
            </button>

            <button onclick="showPage('reports')">
                📈
                <span>รายงาน</span>
            </button>

        </nav>


        <button
            class="logout-button"
            onclick="logout()"
        >
            🚪
            <span>ออกจากระบบ</span>
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>

                <h2 id="pageTitle">
                    ภาพรวมระบบ
                </h2>

                <p>
                    ระบบจัดการเวรนักเรียนออนไลน์
                </p>

            </div>


            <div class="clock" id="clock">
                00:00:00
            </div>

        </header>


        <section id="content"></section>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
